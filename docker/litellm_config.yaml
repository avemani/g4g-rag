model_list:
  - model_name: "local-ollama"
    litellm_params:
      model: "ollama/qwen2.5:3b"
      api_base: "http://ollama-ai:11434"
      timeout: 300
    model_info:
      health_check_timeout: 180

  - model_name: "mini-ollama"
    litellm_params:
      model: "ollama/qwen2.5:0.5b"
      api_base: "http://ollama-ai:11434"
      timeout: 300
    model_info:
      health_check_timeout: 180

  - model_name: "ollama-embedding"
    litellm_params:
      model: "ollama/mxbai-embed-large"
      api_base: "http://ollama-ai:11434"
    model_info:
      mode: embedding
      disable_background_health_check: true

router_settings:
  fallbacks:
    - {"local-ollama": ["mini-ollama"]}
    - {"mini-ollama": ["local-ollama"]}

litellm_settings:
  drop_params: true
  cache: true
  cache_params:
    type: "redis-semantic"
    host: "redis"
    port: 6379
    similarity_threshold: 0.92
    redis_semantic_cache_embedding_model: "ollama-embedding"
    socket_timeout: 10
    socket_connect_timeout: 10